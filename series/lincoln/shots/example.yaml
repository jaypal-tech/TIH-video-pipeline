# Episode 1 shot plan: "The Last Speech", 29 shots, 73 s.
# Source: the Ep 1 production pack (shot list and shot prompts), mapped onto
# the beats that the record stage parses from the brief's script.
#
# Rules the shotplan stage checks before anything is generated:
# - every beat with a line is covered, and each shot's `line` is an exact
#   piece of its beat's line (joined with spaces, the pieces rebuild it);
# - overlay text matches a name card, super or TRUE card in the script;
# - [TOKENS] exist in the bible and every character named is in `cast`;
# - durations add up to 60-90 s.
# Prompts use bible tokens: [BOOTH], [L1], etc. [STYLE] is added to every
# keyframe and [NEG] is the negative prompt, so neither is written here.

episode: 1
fps: 24

shots:
  - id: "1.1"
    beat: e1c1b1
    duration: 2.5
    size: MCU
    cast: [booth]
    place: L1
    keyframe: 85mm medium close-up of [BOOTH] in [L1], hat brim low with drizzle beading on it, torchlight on one side of his face, eyes fixed up and past camera
    motion: Very slow push in, drizzle falling, torch flicker; he speaks quietly without moving his head
    line: You could hit him from here.
    delivery: face
    sound: brass band under
    overlays:
      - {kind: corner_bug, text: "LINCOLN: THE CONSPIRACY · 1", at: 0.0, duration: 1.0}
      - {kind: time_super, text: "WASHINGTON · APRIL 11, 1865", at: 0.0, duration: 1.0}
  - id: "1.2"
    beat: e1c1b1
    duration: 1.5
    size: POV
    cast: []
    place: L1
    keyframe: Point of view from inside [L1] looking up between black umbrellas and torches to one distant lit window, a tall figure behind the glass
    motion: Gentle handheld sway, umbrellas shift, rain streaks
    sound: band, rain
  - id: "1.3"
    beat: e1c1b2
    duration: 3.0
    size: MCU
    cast: [powell]
    place: L1
    keyframe: 85mm medium close-up of [POWELL] in [L1], a head taller than the people around him, rain on his hat, eyes on a distant window
    motion: Static; rain; he speaks a short line with minimal mouth movement
    line: Not in this crowd.
    delivery: face
    overlays:
      - {kind: name_card, text: "LEWIS POWELL · Confederate veteran · 20", at: 0.0}
  - id: "1.4"
    beat: e1c1b3
    duration: 2.5
    size: MCU
    cast: [booth]
    place: L1
    keyframe: 85mm medium close-up of [BOOTH] in [L1] turning his head toward camera-left
    motion: He turns to the man beside him and speaks
    line: Then why are you here?
    delivery: face
    overlays:
      - {kind: name_card, text: "JOHN WILKES BOOTH · America's matinee idol · 26", at: 0.0}
  - id: "1.5"
    beat: e1c1b3
    duration: 1.5
    size: CU
    cast: [powell]
    place: L1
    keyframe: 85mm close-up of [POWELL]'s eyes and brow, unblinking, rain on his face
    motion: Hold; a single raindrop runs down; no blink
    sound: low pulse sting
  - id: "1.6"
    beat: e1c1b4
    duration: 2.0
    size: TWO
    cast: [booth, powell]
    place: L1
    keyframe: 50mm two-shot of [BOOTH] and [POWELL] in [L1], crowd pressing around them, torches between them
    motion: Crowd jostles left to right, torches cross the frame between them
    sound: crowd, band

  - id: "2.1"
    beat: e1c2b1
    duration: 2.0
    size: WIDE
    cast: []
    place: L1
    keyframe: 28mm wide low angle from the lawn in [L1], a sea of umbrellas and torches, the White House north front, one lit window above the portico
    motion: Slow tilt up toward the window; smoke from torches drifts
    sound: band stops mid-bar
  - id: "2.2"
    beat: e1c2b1
    duration: 1.0
    size: INSERT
    cast: []
    place: L2
    keyframe: Close insert in [L2], a hand from frame left holding a candle near loose handwritten pages, the writing unreadable
    motion: The candle lifts slightly and the flame steadies
    sound: rain, hush
  - id: "2.3"
    beat: e1c2b2
    duration: 3.5
    size: MCU
    cast: [lincoln]
    place: L2
    keyframe: 85mm medium close-up of [LINCOLN] in [L2], reading from a loose page held in one hand, candlelight from frame left
    motion: He reads aloud, eyes on the page, slight sway of the page
    line: We meet this evening, not in sorrow,
    delivery: face
    overlays:
      - {kind: name_card, text: "ABRAHAM LINCOLN · President · 56", at: 0.0}
  - id: "2.4"
    beat: e1c2b2
    duration: 2.0
    size: MEDIUM
    cast: []
    place: L1
    keyframe: 50mm medium shot of upturned faces in [L1] under umbrellas, amber torchlight, rain
    motion: Faces still, listening; rain and torch flicker
    line: but in gladness of heart.
    delivery: "off"
  - id: "2.5"
    beat: e1c2b2
    duration: 1.5
    size: CU
    cast: [booth]
    place: L1
    keyframe: 85mm close-up of [BOOTH] among the crowd in [L1], rain on his mustache, expression unmoved
    motion: Hold; others shift around him; he stays still
    sound: rain
  - id: "2.6"
    beat: e1c2b3
    duration: 2.0
    size: MEDIUM
    cast: [tad]
    place: L2
    keyframe: 50mm medium shot just inside the window in [L2], low angle, [TAD] on the floor reaching up as a page falls
    motion: The page drops and the boy catches it before it lands
    sound: paper rustle
    overlays:
      - {kind: name_card, text: "TAD LINCOLN · his son · 12", at: 0.0}
  - id: "2.7"
    beat: e1c2b3
    duration: 2.0
    size: CU
    cast: [tad]
    place: L2
    keyframe: 85mm close-up of [TAD] holding a page, candlelight, looking up
    motion: He smooths the page and glances up at his father
    sound: soft strings enter

  - id: "3.1"
    beat: e1c3b1
    duration: 2.0
    size: INSERT
    cast: [booth]
    place: L1
    keyframe: Close insert of the black kid glove on [BOOTH]'s hand in [L1], face out of frame, rain, torchlight
    motion: He pulls the glove off one finger at a time
    sound: leather creak
  - id: "3.2"
    beat: e1c3b1
    duration: 3.0
    size: MCU
    cast: [booth]
    place: L1
    keyframe: 85mm medium close-up of [BOOTH] in [L1], glove in hand, eyes on the distant window
    motion: He speaks low, eyes never leaving the window
    line: One shot, Lewis. In the dark.
    delivery: face
  - id: "3.3"
    beat: e1c3b2
    duration: 3.5
    size: MCU
    cast: [powell]
    place: L1
    keyframe: 85mm medium close-up of [POWELL] in [L1], unmoving
    motion: He answers flatly, no other movement
    line: And a thousand men on top of me.
    delivery: face
  - id: "3.4"
    beat: e1c3b3
    duration: 2.0
    size: MCU
    cast: [booth]
    place: L1
    keyframe: 85mm medium close-up of [BOOTH] in [L1]
    motion: A slow, thin smile forms
    sound: strings hold
  - id: "3.5"
    beat: e1c3b3
    duration: 2.5
    size: INSERT
    cast: [booth]
    place: L1
    keyframe: Close insert of [BOOTH]'s hand in [L1] pulling on a black kid glove, face out of frame, torchlight
    motion: He fastens the glove at the wrist
    sound: button click

  - id: "4.1"
    beat: e1c4b1
    duration: 2.5
    size: CU
    cast: [lincoln]
    place: L2
    keyframe: 85mm close-up of [LINCOLN] in [L2], a page held close to the candle, the flame lighting his lined face
    motion: He reads slowly, eyes on the page
    line: I would myself prefer
    delivery: face
  - id: "4.2"
    beat: e1c4b1
    duration: 2.5
    size: MEDIUM
    cast: []
    place: L1
    keyframe: 50mm medium shot of two bearded men under one umbrella in [L1]
    motion: They turn and exchange a look
    line: that it were now conferred on the very intelligent,
    delivery: "off"
  - id: "4.3"
    beat: e1c4b1
    duration: 1.0
    size: ECU
    cast: [booth]
    place: L1
    keyframe: Extreme close-up of [BOOTH]'s eyes in [L1], torchlight, rain
    motion: His eyes narrow slightly
    sound: low hit
  - id: "4.4"
    beat: e1c4b2
    duration: 3.5
    size: CU
    cast: [lincoln]
    place: L2
    keyframe: 85mm close-up of [LINCOLN] in [L2] lifting his eyes from the page to the crowd below
    motion: He looks up and speaks out over the crowd
    line: and on those who serve our cause as soldiers.
    delivery: face
    sound: reveal sting
    overlays:
      - {kind: super, text: "HE MEANS THE VOTE. FOR SOME BLACK MEN.", at: 0.0, duration: 2.0}
  - id: "4.5"
    beat: e1c4b2
    duration: 3.5
    size: WIDE
    cast: [lincoln]
    place: L2
    keyframe: 28mm wide from just behind [LINCOLN]'s shoulder in [L2], looking down at the crowd of torches and umbrellas, one black slouch hat in the middle
    motion: Slow push down toward the crowd; everyone shifts except the black hat
    sound: crowd murmur

  - id: "5.1"
    beat: e1c5b1
    duration: 4.0
    size: CU
    cast: [booth]
    place: L1
    keyframe: 85mm close-up of [BOOTH] in [L1], rain running down his face, men cheering around him, out of focus
    motion: Men around him raise their arms; he stays still and speaks low, sideways
    line: That means … citizenship.
    delivery: face
  - id: "5.2"
    beat: e1c5b2
    duration: 1.5
    size: CU
    cast: [powell]
    place: L1
    keyframe: 85mm close-up of [POWELL] in [L1] turning his head toward camera-right
    motion: He turns his eyes from the window to the man beside him
    sound: cheers dip
  - id: "5.3"
    beat: e1c5b2
    duration: 1.5
    size: MCU
    cast: [booth]
    place: L1
    keyframe: 85mm medium close-up of [BOOTH] in [L1] beginning to turn away from the window
    motion: He turns his back on the window, slow and deliberate
    speed: 0.5
    sound: music cuts to rain only
  - id: "5.4"
    beat: e1c5b2
    duration: 3.5
    size: MCU
    cast: [booth]
    place: L1
    keyframe: 85mm medium close-up of [BOOTH] in [L1], back to the window, speaking past a broad dark shoulder in soft focus in the foreground, no second face in frame
    motion: He speaks quietly, still, one breath
    line: That is the last speech he will ever make.
    delivery: face
  - id: "5.5"
    beat: e1c5b3
    duration: 2.5
    size: WIDE
    cast: [booth, powell, lincoln]
    place: L1
    keyframe: 28mm wide of [L1], [BOOTH] and [POWELL] pushing out through the crowd toward camera, [LINCOLN] small in the lit window far behind
    motion: The two men walk out of frame; the crowd closes behind them
    sound: rain, distant voice
  - id: "5.6"
    beat: e1c5b4
    duration: 7.0
    size: MEDIUM
    cast: []
    place: L1
    keyframe: 50mm shot of an empty gap in the crowd in [L1] where a man stood, torches and rain around it
    motion: Slow push in on the empty space
    freeze_at: 4.0
    flash_at: 6.5
    sound: stamp thump on card; flash whoosh
    overlays:
      - {kind: true_card, text: "THREE DAYS LATER, HE PICKED THREE TARGETS. ONE NIGHT. ONE HOUR.", at: 1.0, duration: 6.0}

# Sound cues, in seconds from the start of the episode. `kind` picks the
# model in pipeline.yaml: music (score, band) or sfx (beds, stings, hits).
cues:
  - {id: rain_bed, kind: sfx, at: 0.0, duration: 22.0, gain_db: -22, prompt: "steady night drizzle on umbrellas with a large outdoor crowd murmuring, no music"}
  - {id: rain_bed_2, kind: sfx, at: 22.0, duration: 22.0, gain_db: -22, prompt: "steady night drizzle on umbrellas with a large outdoor crowd murmuring, no music"}
  - {id: rain_bed_3, kind: sfx, at: 44.0, duration: 22.0, gain_db: -22, prompt: "steady night drizzle on umbrellas with a large outdoor crowd murmuring, no music"}
  - {id: rain_tail, kind: sfx, at: 66.0, duration: 7.0, gain_db: -24, prompt: "soft night rain only, no voices"}
  - {id: band, kind: music, at: 0.0, duration: 13.0, gain_db: -18, prompt: "diegetic 1860s brass military band playing a march outdoors in rain, heard from within a crowd, ends abruptly mid-bar"}
  - {id: pulse, kind: sfx, at: 9.5, duration: 1.5, gain_db: -14, prompt: "single low cinematic pulse"}
  - {id: strings, kind: music, at: 25.0, duration: 33.5, gain_db: -20, prompt: "low sustained cello and viola drone, tense, slowly rising, period drama score, no percussion"}
  - {id: low_hit, kind: sfx, at: 45.0, duration: 1.0, gain_db: -12, prompt: "low cinematic impact hit"}
  - {id: reveal, kind: sfx, at: 46.0, duration: 2.0, gain_db: -12, prompt: "short dark orchestral reveal sting"}
  - {id: deep_hit, kind: sfx, at: 63.0, duration: 1.5, gain_db: -10, prompt: "deep sub boom impact"}
  - {id: stamp, kind: sfx, at: 67.0, duration: 1.0, gain_db: -8, prompt: "heavy rubber stamp thump on paper, close"}
  - {id: whoosh, kind: sfx, at: 72.4, duration: 0.6, gain_db: -12, prompt: "bright short whoosh into white"}
