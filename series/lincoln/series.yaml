title: "Lincoln: The Conspiracy"
episodes: 30
true_story: true
source_format: table_script
budget:
  warn: 1500.00
  stop: 3000.00
  proving_cap: 100.00
paywalls:
  5: early
  11: late
held_back:
  "the shot": 12
  "the knife": 12
  "Lincoln's death": 14
knowledge_rules:
  - who: Atzerodt
    topic: the killing plan
    not_before: 5
tone: >-
  Everyone knows how the night ends. The drama is the road to it: the people,
  the near misses, and the things almost nobody knows. Show violence with
  restraint and never make it glamorous. Treat the racism at the heart of
  Booth's motive plainly and without softening it.
ending_convention: >-
  Each episode ends on a freeze with a full-width TRUE card stating a documented
  fact. The cliff is the unresolved moment just before the card. The card must
  sharpen the question the viewer is left with, never answer it.
story_notes:
  - Booth is magnetic but never admired. He is a racist murderer.
  - Atzerodt moves from frightened recruit, to the man who never knocks, to the weak link.
  - Episodes 1 to 5 each give one piece of the plan and spend none of the payoff.
  - Important setups include the calling card, the field glasses, the carbines, the empty guard chair and Grant's refusal.
  - The pocket-watch tick is a recurring motif.
  - By his own account, Atzerodt learned the plan was murder at the 8 pm meeting in episode 5.
  - The parcel Mary Surratt carried held field glasses. The carbines were hidden at the tavern weeks earlier. Never imply the parcel held guns.
  - Keep these open - who the card was for, Mary Surratt's guilt, and when kidnapping became murder.
script_notes:
  1:
    - The episode opens the season, so there is no previous ending to pick up. Check the hook lands in the first 3 seconds.
    - The source says only that Booth urged Powell to shoot and Powell refused. It records no hesitation, no look back and no decision by Powell on the lawn. Do not show Powell wavering or choosing; he simply follows Booth.
  2:
    - Later episodes usually open on the previous episode's cliff. This draft opens on a new scene. Add a one-second echo of the previous cliff, or say why not.
  3:
    - The parcel held Booth's field glasses (Lloyd's testimony). The carbines were hidden at the tavern weeks earlier. As drafted, 'shooting irons' plus the carbine card lets viewers assume the parcel held guns.
    - This draft opens on a new scene rather than the previous cliff. Add a one-second echo, or say why not.
  4:
    - This draft opens on a new scene rather than the previous cliff. Add a one-second echo, or say why not.
  5:
    - The draft has Booth snap the Derringer shut. That does not fit a single-shot, muzzle-loading percussion Deringer, and 'brass' needs checking. The likely action is thumbing the hammer and seating the cap. Confirm against the source.
    - The source calls who was in the room an 'accounts say', but the scene shows all four men as fact.
    - The final twist lands 10 seconds before the end. The benchmark is 5 to 8 seconds.
    - This draft opens on a new scene rather than the previous cliff. Add a one-second echo, or say why not.
craft:
  turns: [4, 5]
  talk_share: 0.55
  words_per_line: 5
  max_places: 2
