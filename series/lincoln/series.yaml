title: "Lincoln: The Conspiracy"
episodes: 30
true_story: true
source_format: table_script
budget:
  warn: 1500.00
  stop: 3000.00
  proving_cap: 100.00
paywalls:
  5: early
  11: late
held_back:
  "the shot": 12
  "the knife": 12
  "Lincoln's death": 14
knowledge_rules:
  - who: Atzerodt
    topic: the killing plan
    not_before: 5
tone: >-
  Everyone knows how the night ends. The drama is the road to it: the people,
  the near misses, and the things almost nobody knows. Show violence with
  restraint and never make it glamorous. Treat the racism at the heart of
  Booth's motive plainly and without softening it.
ending_convention: >-
  Each episode ends on a freeze with a full-width TRUE card stating a documented
  fact. The cliff is the unresolved moment just before the card. The card must
  sharpen the question the viewer is left with, never answer it.
story_notes:
  - Booth is magnetic but never admired. He is a racist murderer.
  - Atzerodt moves from frightened recruit, to the man who never knocks, to the weak link.
  - Episodes 1 to 5 each give one piece of the plan and spend none of the payoff.
  - Important setups include the calling card, the field glasses, the carbines, the empty guard chair and Grant's refusal.
  - The pocket-watch tick is a recurring motif.
  - By his own account, Atzerodt learned the plan was murder at the 8 pm meeting in episode 5.
  - The parcel Mary Surratt carried held field glasses. The carbines were hidden at the tavern weeks earlier. Never imply the parcel held guns.
  - Keep these open - who the card was for, Mary Surratt's guilt, and when kidnapping became murder.
script_notes:
  1:
    - The episode opens the season, so there is no previous ending to pick up. Check the hook lands in the first 3 seconds.
    - The source says only that Booth urged Powell to shoot and Powell refused. It records no hesitation, no look back and no decision by Powell on the lawn. Do not show Powell wavering or choosing; he simply follows Booth.
    - In the draft, Lincoln's line "I would myself prefer that it were now conferred..." has no subject, so the viewer cannot tell what "it" is. Put the real sentence that comes before it in the address directly before it ("It is also unsatisfactory to some that the elective franchise is not given to the colored man."), keep the "I would myself prefer..." sentence whole, and have the narrator say in plain words that he means the vote for Black men. Make room by cutting or shortening other beats.
    - A viewer who knows no history must know, within the first 15 seconds, who the man in the crowd is and what he is there for. Have the narrator name John Wilkes Booth and say what he is (the source calls him America's matinee idol, a famous actor) and where his loyalty lies, using only what the source supports. Do not rely on the name card alone.
    - Do not assume the viewer knows who Lee is. Say in plain words that the Civil War had just ended, two days earlier.
    - The closing card names a plan with three targets that nothing in the episode has explained. Have the narrator's last line set it up in plain words, using only what the source supports, so the card makes sense.
    - The lawn conversation between Booth and Powell is known only third-hand (Eckert, 1867, from what Powell told him). Show that from the first beat with a small super such as 'AS POWELL LATER TOLD IT · THIRD-HAND', so the scene does not play as settled fact.
    - >-
      Open on the narrator, not on Booth. The first beat, at 0.0, is one narration line of at most 12 words, heard over the opening shot of the crowd and the lit window, and it is the hook. Use this line unless the source does not support it: "April 11, 1865. Abraham Lincoln was about to give his last speech." Booth's "You could hit him from here." comes straight after it, then Powell's refusal, then the narration line that says who Booth is.
    - >-
      Two history fixes, change only these beats. (a) Replace "Then why are you here?" with a line that only presses the refusal, such as "Then you won't do it?", because the source does not say why either man came. (b) Do not show the crowd cheering directly after Lincoln's lines about the vote: the source says only that the crowd was celebrating Lee's surrender. Show Booth in the crowd without a cheering reaction at that moment.
    - >-
      Apart from the notes above, keep the lines and their order as they were in the last version: narrator on Lee's surrender, narrator on who Booth is, Lincoln's first line, Booth and Powell on the one shot, Lincoln's two sentences about the vote kept together, the narrator naming Lincoln and the vote, Booth's two reported lines, the narrator's closing line about the plan, the card.
    - >-
      History check, narration must match the source exactly. (a) Do not say the Civil War was over or call Lee's army the South's main army: say that two days earlier the South's General Lee surrendered and Washington was celebrating. (b) Do not state Booth's loyalty or why he came: the source supports only that he was a famous actor, America's matinee idol, and that he was in the crowd that night. (c) In the line explaining the vote, name Lincoln as the subject ("Lincoln meant the right to vote...") so that, over Booth's face, "he" cannot be read as Booth. Keep everything else in the current script as it is.
  2:
    - Later episodes usually open on the previous episode's cliff. This draft opens on a new scene. Add a one-second echo of the previous cliff, or say why not.
  3:
    - The parcel held Booth's field glasses (Lloyd's testimony). The carbines were hidden at the tavern weeks earlier. As drafted, 'shooting irons' plus the carbine card lets viewers assume the parcel held guns.
    - This draft opens on a new scene rather than the previous cliff. Add a one-second echo, or say why not.
  4:
    - This draft opens on a new scene rather than the previous cliff. Add a one-second echo, or say why not.
  5:
    - The draft has Booth snap the Derringer shut. That does not fit a single-shot, muzzle-loading percussion Deringer, and 'brass' needs checking. The likely action is thumbing the hammer and seating the cap. Confirm against the source.
    - The source calls who was in the room an 'accounts say', but the scene shows all four men as fact.
    - The final twist lands 10 seconds before the end. The benchmark is 5 to 8 seconds.
    - This draft opens on a new scene rather than the previous cliff. Add a one-second echo, or say why not.
craft:
  turns: [4, 5]
  talk_share: 0.55
  words_per_line: 5
