[project]
name = "tih"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "pydantic (>=2.14.4,<3.0.0)",
    "pyyaml (>=6.0.4,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fal-client (>=1.0.3,<2.0.0)",
    "typer (>=0.29.2,<0.30.0)",
    "python-dotenv (>=1.2.4,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"


[project.scripts]
tih = "tih.cli:app"
